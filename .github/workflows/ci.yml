name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check module metadata
        run: |
          go mod tidy
          git status --porcelain -- go.mod go.sum | tee /tmp/zipit-module-status
          test ! -s /tmp/zipit-module-status
      - name: Run go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run race detector
        run: go test -race ./...

  cross-build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: zipit-linux-amd64
            runner: ubuntu-24.04
          - goos: linux
            goarch: arm64
            output: zipit-linux-arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            output: zipit-darwin-amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            output: zipit-darwin-arm64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            output: zipit-windows-amd64.exe
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            output: zipit-windows-arm64.exe
            runner: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build command
        shell: bash
        run: go build -trimpath -o "${{ runner.temp }}/${{ matrix.output }}" ./cmd/zipit
      - name: Check Linux runtime dependencies
        if: ${{ matrix.goos == 'linux' }}
        shell: bash
        run: |
          binary="${{ runner.temp }}/${{ matrix.output }}"
          file "$binary"
          readelf -hW "$binary" >/dev/null
          program_headers="$(readelf -lW "$binary")"
          dynamic_section="$(readelf -dW "$binary")"
          if grep -Eq '^[[:space:]]*INTERP[[:space:]]' <<<"$program_headers"; then
            echo "Linux smoke binary unexpectedly requests a dynamic loader."
            exit 1
          fi
          if grep -q '(NEEDED)' <<<"$dynamic_section"; then
            echo "Linux smoke binary unexpectedly depends on a shared library."
            exit 1
          fi
      - name: Upload Linux smoke binary
        if: ${{ matrix.goos == 'linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zipit-linux-${{ matrix.goarch }}
          path: ${{ runner.temp }}/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  linux-smoke:
    name: Linux smoke (${{ matrix.distro }}/${{ matrix.arch }})
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            arch: amd64
            runner: ubuntu-24.04
            image: ubuntu:24.04
          - distro: debian
            arch: amd64
            runner: ubuntu-24.04
            image: debian:13-slim
          - distro: fedora
            arch: amd64
            runner: ubuntu-24.04
            image: fedora:44
          - distro: arch
            arch: amd64
            runner: ubuntu-24.04
            image: archlinux:base-20260906.0.587075
          - distro: alpine
            arch: amd64
            runner: ubuntu-24.04
            image: alpine:3.23
          - distro: nix
            arch: amd64
            runner: ubuntu-24.04
            image: nixos/nix:2.35.2
          - distro: ubuntu
            arch: arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
          - distro: debian
            arch: arm64
            runner: ubuntu-24.04-arm
            image: debian:13-slim
          - distro: fedora
            arch: arm64
            runner: ubuntu-24.04-arm
            image: fedora:44
          - distro: alpine
            arch: arm64
            runner: ubuntu-24.04-arm
            image: alpine:3.23
          - distro: nix
            arch: arm64
            runner: ubuntu-24.04-arm
            image: nixos/nix:2.35.2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Download Linux smoke binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zipit-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/zipit-smoke
      - name: Create smoke fixture
        shell: bash
        run: |
          chmod 0755 "${{ runner.temp }}/zipit-smoke/zipit-linux-${{ matrix.arch }}"
          mkdir -p "${{ runner.temp }}/zipit-fixture/node_modules"
          mkdir -p "${{ runner.temp }}/zipit-output"
          printf 'keep\n' > "${{ runner.temp }}/zipit-fixture/keep.txt"
          printf 'ignore\n' > "${{ runner.temp }}/zipit-fixture/node_modules/ignored.txt"
      - name: Run Zipit in ${{ matrix.distro }}
        shell: bash
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --mount type=bind,source="${{ runner.temp }}/zipit-smoke/zipit-linux-${{ matrix.arch }}",target=/zipit,readonly \
            --mount type=bind,source="${{ runner.temp }}/zipit-fixture",target=/fixture,readonly \
            --mount type=bind,source="${{ runner.temp }}/zipit-output",target=/tmp/output \
            "${{ matrix.image }}" \
            /bin/sh -ec '
              /zipit version
              /zipit version --short
              /zipit --help
              /zipit /fixture -x node_modules/ -o /tmp/output/fixture.zip
              test -s /tmp/output/fixture.zip
            '
      - name: Inspect smoke archive
        shell: python
        run: |
          import os
          import zipfile

          archive = os.path.join(os.environ["RUNNER_TEMP"], "zipit-output", "fixture.zip")
          with zipfile.ZipFile(archive) as created:
              names = set(created.namelist())
          if "keep.txt" not in names:
              raise SystemExit(f"archive is missing keep.txt: {sorted(names)}")
          if "node_modules/ignored.txt" in names:
              raise SystemExit(f"archive contains excluded content: {sorted(names)}")

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - quality
      - test
      - race
      - cross-build
      - linux-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        if: ${{ needs.quality.result != 'success' || needs.test.result != 'success' || needs.race.result != 'success' || needs.cross-build.result != 'success' || needs.linux-smoke.result != 'success' }}
        run: exit 1
      - name: Confirm quality gate
        run: echo "All required CI jobs passed."
